name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Release and deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Check out the branch tip (not the detached pushed SHA) so semantic-release's
          # local main matches the freshly fetched remote main. Detached HEAD pinned to an
          # older SHA is what produced "The local branch main is behind the remote one".
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Install server dependencies
        run: npm ci
        working-directory: server

      - name: Test and build
        run: npm run ci

      - name: Run semantic-release
        id: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # The @semantic-release/exec successCmd (see .releaserc.json) writes
        # released/version/sha/release_date to $GITHUB_OUTPUT, but only when a release is
        # actually published. No release => no output => the gated steps below are skipped.
        run: npx semantic-release

      - name: Install Railway CLI
        if: steps.release.outputs.released == 'true'
        run: npm install -g @railway/cli

      # RAILWAY_TOKEN must be a Railway *project* token (Project -> Settings -> Tokens),
      # scoped to the production environment. Project tokens are long-lived and already
      # carry the project + environment, so no `railway link` (an account-level action that
      # needs RAILWAY_API_TOKEN) is required — that mismatch is what forced a fresh token
      # every release. We only target the service with --service.
      - name: Set Railway release variables
        if: steps.release.outputs.released == 'true'
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_SERVICE_ID: ${{ secrets.RAILWAY_SERVICE_ID }}
          APP_VERSION: ${{ steps.release.outputs.version }}
          GIT_SHA: ${{ steps.release.outputs.sha }}
          RELEASE_DATE: ${{ steps.release.outputs.release_date }}
        run: railway variables --service "$RAILWAY_SERVICE_ID" --set "APP_VERSION=$APP_VERSION" --set "GIT_SHA=$GIT_SHA" --set "RELEASE_DATE=$RELEASE_DATE" --skip-deploys

      - name: Deploy to Railway
        if: steps.release.outputs.released == 'true'
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_SERVICE_ID: ${{ secrets.RAILWAY_SERVICE_ID }}
        run: railway up --ci --service "$RAILWAY_SERVICE_ID"
